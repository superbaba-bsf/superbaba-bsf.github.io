<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سوبر بابا · تتبّع طلبك</title>
<link rel="stylesheet" href="../assets/shared.css">
</head>
<body>
<div class="wrap">
  <div class="sbo-hero"><img src="../assets/hero.png" alt=""><div><h1>سوبر بابا</h1><p>بيتزا وسندوتشات، بني سويف</p></div></div>
  <nav class="nav" aria-label="الصفحات">
    <a href="../order/">العميل</a>
    <a href="../track/" class="on" aria-current="page">تتبّع الطلب</a>
    <a href="../kitchen/">المطبخ</a>
    <a href="../courier/">المندوب</a>
  </nav>

  <section class="card" id="paste" style="display:none">
    <h3 style="margin-top:0">تتبّع طلبك</h3>
    <p class="muted">الصق لينك التتبع اللي وصلك من سوبر بابا على واتساب.</p>
    <div class="sbo-form">
      <label>لينك التتبع أو كود الطلب<input id="tinput" dir="ltr" placeholder="https://superbaba-bsf.github.io/track/#..."></label>
    </div>
    <button type="button" class="btn" id="go">اعرض الطلب</button>
    <p class="err" id="perr" role="alert" style="display:none"></p>
  </section>

  <section class="card" id="trkcard">
    <div id="trk"></div>
  </section>

  <p class="muted" style="text-align:center">مش لاقي طلبك؟ <a href="https://wa.me/201102707994" target="_blank" rel="noopener noreferrer">كلمنا على واتساب</a></p>
  <footer class="closing">مفيش دفع أونلاين. رسوم التوصيل والإجمالي النهائي بيتأكدوا معاك على واتساب.</footer>
</div>
<script src="../assets/menu.js"></script>
<script src="../assets/api.js"></script>
<script src="../assets/track.js"></script>
<script>
const T=window.SB_TRACK;
const box=document.getElementById('trk');
function boot(tok){
  if(!tok){ document.getElementById('paste').style.display=''; box.innerHTML=''; return; }
  document.getElementById('paste').style.display='none';
  T.mount(box,tok,{share:true});
}
document.getElementById('go').addEventListener('click',()=>{
  const t=T.tokenFromPaste(document.getElementById('tinput').value);
  if(!t){ const e=document.getElementById('perr'); e.textContent='الصق اللينك أو الكود.'; e.style.display=''; return; }
  history.replaceState(null,'','#'+t); boot(t);
});
document.getElementById('tinput').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('go').click(); });
boot(T.tokenFromLocation());
</script>
</body>
</html>
