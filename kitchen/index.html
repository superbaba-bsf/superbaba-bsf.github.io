<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سوبر بابا · المطبخ</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../assets/shared.css">
</head>
<body>
<div class="wrap">
  <div class="sbo-hero"><img src="../assets/hero.png" alt=""><div><h1>سوبر بابا</h1><p>بيتزا وسندوتشات، بني سويف</p></div></div>
  <nav class="nav" aria-label="الصفحات">
    <a href="../order/">العميل</a>
    <a href="../track/">تتبّع الطلب</a>
    <a href="../kitchen/" class="on" aria-current="page">المطبخ</a>
    <a href="../courier/">المندوب</a>
  </nav>

  <section class="card" id="login-card">
    <h3 style="margin-top:0"><small class="muted" style="display:block;font-size:12px">المطبخ</small>دخول سوبر بابا</h3>
    <div class="sbo-form">
      <label>الإيميل<input id="f-email" dir="ltr" autocomplete="username"></label>
      <label>كلمة السر<input id="f-pw" type="password" dir="ltr" autocomplete="current-password"></label>
      <button type="button" class="btn" id="login" disabled>دخول</button>
      <p class="err" id="login-err" role="alert" style="display:none"></p>
    </div>
  </section>

  <section class="card" id="board" style="display:none">
    <h3 style="margin-top:0"><small class="muted" style="display:block;font-size:12px">المطبخ</small><span id="board-title"></span></h3>
    <p class="err" id="board-err" role="alert" style="display:none"></p>
    <div id="new-alert" style="display:none;position:sticky;top:0;z-index:50;background:#c0392b;color:#fff;border-radius:14px;padding:14px;margin-bottom:12px;text-align:center;font-weight:700;font-size:18px">
      <div id="new-alert-t">🔔 أوردر جديد!</div>
      <button type="button" class="btn" id="new-alert-ok" style="margin-top:8px;background:#fff;color:#c0392b">تمام، استلمت</button>
    </div>
    <div class="callout" id="push-box"><b>تنبيهات الأوردرات</b>
      <p class="muted" id="push-st" style="margin:4px 0">الصوت بيرن ويفضل يرن لحد ما تدوس «تمام» طول ما الصفحة مفتوحة. وفعّل الإشعار عشان يوصلك والصفحة مقفولة.</p>
      <button type="button" class="btn sm" id="push-btn">🔔 فعّل إشعارات الأوردرات على الجهاز ده</button>
      <button type="button" class="btn ghost sm" id="snd-test">جرّب الصوت</button>
    </div>
    <div id="orders"></div>
    <div id="rv-staff"></div>
    <button type="button" class="btn sec sm" id="logout">خروج</button>
  </section>

  <footer class="closing">متوصل بالتخزين.</footer>
</div>

<script src="../assets/menu.js"></script>
<script src="../assets/api.js"></script>
<script>
const api=window.SB_API, money=window.SB_MONEY, errText=window.SB_ERR, STATUS_AR=window.SB_STATUS_AR;
let jwt='', timer=null;

const email=document.getElementById('f-email'), pw=document.getElementById('f-pw'), loginBtn=document.getElementById('login');
function lv(){loginBtn.disabled=!(email.value&&pw.value);}
email.addEventListener('input',lv);pw.addEventListener('input',lv);

loginBtn.addEventListener('click',async()=>{
  loginBtn.disabled=true;loginBtn.textContent='...';
  const err=document.getElementById('login-err');err.style.display='none';
  try{jwt=await api.login(email.value.trim(),pw.value);pw.value='';showBoard();}
  catch(e){err.textContent='الدخول فشل. راجع الإيميل وكلمة السر.';err.style.display='';}
  loginBtn.textContent='دخول';lv();
});
document.getElementById('logout').addEventListener('click',()=>{
  jwt='';seen=null;stopAlarm();if(timer)clearInterval(timer);
  document.getElementById('board').style.display='none';
  document.getElementById('login-card').style.display='';
});

const TRACK_BASE=location.origin+'/track/#';
const trackCode=o=>'SB-'+String(o.public_token||'').slice(0,6).toUpperCase();
function trackLink(o){return TRACK_BASE+o.public_token;}
function waTrack(o){
  const p=String(o.phone||'').replace(/\D/g,'').replace(/^0/,'');
  const msg='أهلاً '+o.customer_name+'، طلبك من سوبر بابا '+trackCode(o)+' اتسجل عندنا. تابع حالته من اللينك ده: '+trackLink(o);
  return 'https://wa.me/20'+p+'?text='+encodeURIComponent(msg);
}
function copyTrack(btn){
  const link=btn.dataset.link;
  const done=()=>{btn.textContent='اتنسخ ✓';};
  if(navigator.clipboard){navigator.clipboard.writeText(link).then(done,done);}else{prompt('لينك التتبع:',link);}
}

function orderCard(o,couriers){
  const actions=[];
  if(o.status==='new')actions.push(`<button type="button" class="btn sm" onclick="act('${o.id}','preparing')">ابدأ التجهيز</button>`);
  if(o.status==='preparing')actions.push(`<button type="button" class="btn sm" onclick="act('${o.id}','ready')">جاهز</button>`);
  if(o.status==='ready'||o.status==='assigned')couriers.forEach(c=>actions.push(`<button type="button" class="btn sm${o.courier_id===c.user_id?'':' sec'}" onclick="assign('${o.id}','${c.user_id}')">سلّم لـ ${c.name}</button>`));
  if(o.status!=='picked_up')actions.push(`<button type="button" class="btn ghost sm" onclick="act('${o.id}','cancelled')">إلغاء</button>`);
  return `<div class="sbo-line"><div class="sbo-line-h"><b>${o.customer_name}</b><span class="sbo-pill s-${o.status}">${STATUS_AR[o.status]||o.status}</span></div>
    <p>${o.address}</p>
    <p class="sbo-links"><a href="tel:${o.phone}" dir="ltr">${o.phone}</a><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.address)}" target="_blank" rel="noreferrer">الخريطة</a></p>
    <p class="sbo-links"><a href="${waTrack(o)}" target="_blank" rel="noreferrer">ابعت لينك التتبع واتساب</a><button type="button" class="btn ghost sm" onclick="copyTrack(this)" data-link="${trackLink(o)}">انسخ لينك التتبع</button></p>
    ${o.note?`<p class="muted">ملاحظات: ${o.note}</p>`:''}
    <ul>${o.items.map(i=>`<li>${i.qty} × ${i.name}${i.extras.length?' + '+i.extras.join(' + '):''}</li>`).join('')}</ul>
    <p><b>${money(o.total_egp)}</b> بدون التوصيل</p>
    <div class="sbo-actions">${actions.join('')}</div></div>`;
}


/* ---- new order alarm + push ---- */
const VAPID='BNZNVDJ-I031D4oyFYUmN388MmWbIzLa1uOg2iuWibC-N7mBXMkycymHCaQPXefqrkZ8qFD_P38KV7Cwt9rL53s';
let actx=null, alarmTimer=null, seen=null, pending=0;
function unlockAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!actx)actx=new AC();if(actx.state==='suspended')actx.resume();}catch(e){}}
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
function ring(){
  try{
    unlockAudio();if(!actx||actx.state!=='running')return;
    const t0=actx.currentTime;
    [[880,0],[1175,0.25],[880,0.5],[1175,0.75]].forEach(([f,d])=>{
      const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0+d);g.gain.exponentialRampToValueAtTime(0.9,t0+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.22);
      o.connect(g);g.connect(actx.destination);o.start(t0+d);o.stop(t0+d+0.25);
    });
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate([500,200,500,200,500]);}catch(e){}
}
function startAlarm(n){
  pending+=n;
  const box=document.getElementById('new-alert');
  document.getElementById('new-alert-t').textContent='🔔 أوردر جديد! ('+pending+')';
  box.style.display='';
  if(!alarmTimer){ring();alarmTimer=setInterval(ring,2200);}
  document.title='🔔 أوردر جديد - سوبر بابا';
}
function stopAlarm(){
  if(alarmTimer){clearInterval(alarmTimer);alarmTimer=null;}
  pending=0;document.getElementById('new-alert').style.display='none';
  document.title='المطبخ | سوبر بابا';
  try{navigator.vibrate&&navigator.vibrate(0);}catch(e){}
}
document.getElementById('new-alert-ok').addEventListener('click',stopAlarm);
document.getElementById('snd-test').addEventListener('click',()=>{unlockAudio();setTimeout(ring,150);});
function checkNew(list){
  const ids=new Set(list.map(o=>o.id));
  if(seen===null){seen=ids;return;}
  const fresh=list.filter(o=>o.status==='new'&&!seen.has(o.id));
  list.forEach(o=>seen.add(o.id));
  if(fresh.length)startAlarm(fresh.length);
}
const b64u8=b=>{const p='='.repeat((4-b.length%4)%4);const r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)));};
async function pushRegister(ask){
  const st=document.getElementById('push-st'),btn=document.getElementById('push-btn');
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){st.textContent='المتصفح ده مش بيدعم الإشعارات. على الآيفون ضيف التطبيق للشاشة الرئيسية الأول.';return;}
    if(Notification.permission==='default'&&ask)await Notification.requestPermission();
    if(Notification.permission==='denied'){st.textContent='الإشعارات متقفلة للموقع ده من إعدادات المتصفح. افتحها من الإعدادات.';return;}
    if(Notification.permission!=='granted')return;
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u8(VAPID)});
    const j=sub.toJSON();
    await api.kitchenPushSubscribe(jwt,j.endpoint,j.keys.p256dh,j.keys.auth);
    st.textContent='✓ إشعارات الأوردرات شغالة على الجهاز ده.';btn.style.display='none';
  }catch(e){st.textContent='ما قدرتش أفعّل الإشعار. جرّب تاني.';}
}
document.getElementById('push-btn').addEventListener('click',()=>{unlockAudio();pushRegister(true);});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});

async function reload(){
  const err=document.getElementById('board-err');
  try{
    const [orders,couriers]=await Promise.all([api.listOrders(jwt),api.listCouriers(jwt)]);
    const list=(orders||[]).filter(o=>o.status!=='delivered'&&o.status!=='cancelled');
    checkNew(list);
    document.getElementById('board-title').textContent=`الطلبات الحالية (${list.length})`;
    document.getElementById('orders').innerHTML=list.length?list.map(o=>orderCard(o,couriers||[])).join(''):'<p class="muted">مفيش طلبات دلوقتي.</p>';
    err.style.display='none';
    loadReviews();
  }catch(e){err.textContent=errText(e);err.style.display='';}
}
function showBoard(){
  document.getElementById('login-card').style.display='none';
  document.getElementById('board').style.display='';
  reload();if(timer)clearInterval(timer);timer=setInterval(reload,8000);pushRegister(false);
}
const escK=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const starsK=n=>n?'★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n):'-';
async function loadReviews(){
  const box=document.getElementById('rv-staff');
  try{
    const r=await api.reviewsStaff(jwt);
    const rest=r.restaurant||{};
    box.innerHTML=`<h3>التقييمات</h3><p><b>الأكل: ${rest.count?Number(rest.avg).toFixed(1)+' ★ ('+rest.count+')':'لسه مفيش'}</b></p>`+
      (r.couriers&&r.couriers.length?'<p>'+r.couriers.map(c=>`${escK(c.name)}: ${Number(c.avg).toFixed(1)} ★ (${c.count})`).join(' · ')+'</p>':'')+
      (r.reviews||[]).map(x=>`<div class="sbo-line"><div class="sbo-line-h"><b>${escK(x.name||'عميل')} <small class="muted">${escK(x.code)}</small></b><span class="sbo-pill">${x.hidden?'مخفي':'ظاهر'}</span></div>
        <p>الأكل ${starsK(x.restaurant_stars)}${x.courier_name?' · '+escK(x.courier_name)+' '+starsK(x.courier_stars):''}</p>${x.comment?'<p>'+escK(x.comment)+'</p>':''}
        <div class="sbo-actions"><button type="button" class="btn ghost sm" onclick="hideReview('${x.id}',${!x.hidden})">${x.hidden?'أظهر':'اخفي'}</button></div></div>`).join('');
  }catch(e){}
}
async function hideReview(id,hidden){try{await api.reviewHide(jwt,id,hidden);await loadReviews();}catch(e){}}
async function act(id,status){
  const err=document.getElementById('board-err');
  try{await api.setStatus(jwt,id,status);await reload();}catch(e){err.textContent=errText(e);err.style.display='';}
}
async function assign(id,courier){
  const err=document.getElementById('board-err');
  try{await api.assign(jwt,id,courier);await reload();}catch(e){err.textContent=errText(e);err.style.display='';}
}
</script>
</body>
</html>
