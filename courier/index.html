<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سوبر بابا · المندوب</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../assets/shared.css">
</head>
<body>
<div class="wrap">
  <div class="sbo-hero"><img src="../assets/hero.png" alt=""><div><h1>سوبر بابا</h1><p>بيتزا وسندوتشات، بني سويف</p></div></div>
  <nav class="nav" aria-label="الصفحات">
    <a href="../order/">العميل</a>
    <a href="../kitchen/">المطبخ</a>
    <a href="../courier/" class="on" aria-current="page">المندوب</a>
  </nav>

  <section class="card" id="login-card">
    <h3 style="margin-top:0"><small class="muted" style="display:block;font-size:12px">المندوب</small>دخول المندوب</h3>
    <div class="sbo-form">
      <label>رقم المندوب<input id="f-email" dir="ltr" inputmode="numeric" autocomplete="username" placeholder="1 - 10"></label>
      <label>الرمز<input id="f-pw" type="password" inputmode="numeric" dir="ltr" autocomplete="current-password"></label>
      <button type="button" class="btn" id="login" disabled>دخول</button>
      <p class="err" id="login-err" role="alert" style="display:none"></p>
    </div>
  </section>

  <section class="card" id="board" style="display:none">
    <h3 style="margin-top:0"><small class="muted" style="display:block;font-size:12px">المندوب</small><span id="board-title"></span></h3>
    <p class="err" id="board-err" role="alert" style="display:none"></p>
    <div id="orders"></div>
    <button type="button" class="btn sec sm" id="logout">خروج</button>
  </section>

  <footer class="closing">متوصل بالتخزين.</footer>
</div>

<script src="../assets/menu.js"></script>
<script src="../assets/api.js"></script>
<script>
const api=window.SB_API, money=window.SB_MONEY, errText=window.SB_ERR, STATUS_AR=window.SB_STATUS_AR;
let jwt='', timer=null;

const email=document.getElementById('f-email'), pw=document.getElementById('f-pw'), loginBtn=document.getElementById('login');
function lv(){loginBtn.disabled=!(email.value&&pw.value);}
email.addEventListener('input',lv);pw.addEventListener('input',lv);

const BASE='https://oyrebngeqxfkiczsltru.supabase.co', KEY='sb_publishable_BRk0ALVVuSwxKj1PpCB37g_uZycYy69', RT='sbc_rt';
async function tok(grant,body){
  const res=await fetch(BASE+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!res.ok){const e=new Error('HTTP_'+res.status);e.status=res.status;throw e;}
  return res.json();
}
function save(r){jwt=r.access_token;localStorage.setItem(RT,r.refresh_token);}
let refreshing=null;
function refresh(){
  if(refreshing)return refreshing;
  const rt=localStorage.getItem(RT);
  if(!rt)return Promise.reject(new Error('NO_SESSION'));
  refreshing=tok('refresh_token',{refresh_token:rt}).then(save).catch(e=>{if(e.status&&e.status<500)localStorage.removeItem(RT);throw e;}).finally(()=>{refreshing=null;});
  return refreshing;
}
async function authed(fn){
  try{return await fn(jwt);}
  catch(e){
    if(/HTTP_(401|403)|JWT/i.test(e.message||'')){await refresh();return fn(jwt);}
    throw e;
  }
}
loginBtn.addEventListener('click',async()=>{
  loginBtn.disabled=true;loginBtn.textContent='...';
  const err=document.getElementById('login-err');err.style.display='none';
  try{
    const n=email.value.replace(/\D/g,''), v=email.value.trim();
    const em=v.indexOf('@')>-1?v:'courier'+n+'@superbaba-bsf.github.io';
    const p=v.indexOf('@')>-1?pw.value.trim():'sbc-'+pw.value.trim();
    save(await tok('password',{email:em,password:p}));pw.value='';showBoard();
  }catch(e){err.textContent='الدخول فشل. راجع رقم المندوب والرمز.';err.style.display='';}
  loginBtn.textContent='دخول';lv();
});
document.getElementById('logout').addEventListener('click',()=>{
  jwt='';localStorage.removeItem(RT);if(timer)clearInterval(timer);
  document.getElementById('board').style.display='none';
  document.getElementById('login-card').style.display='';
});
refresh().then(showBoard).catch(()=>{});
setInterval(()=>{if(jwt)refresh().catch(()=>{});},30*60*1000);

function orderCard(o){
  const label=o.status==='assigned'?'استلمت من المطعم':'اتسلّم للعميل';
  return `<div class="sbo-line"><div class="sbo-line-h"><b>${o.customer_name}</b><span class="sbo-pill s-${o.status}">${STATUS_AR[o.status]||o.status}</span></div>
    <p>${o.address}</p>
    <p class="sbo-links"><a href="tel:${o.phone}" dir="ltr">${o.phone}</a><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.address)}" target="_blank" rel="noreferrer">الخريطة</a></p>
    ${o.note?`<p class="muted">ملاحظات: ${o.note}</p>`:''}
    <ul>${o.items.map(i=>`<li>${i.qty} × ${i.name}${i.extras.length?' + '+i.extras.join(' + '):''}</li>`).join('')}</ul>
    <p><b>${money(o.total_egp)}</b> بدون التوصيل</p>
    <div class="sbo-actions"><button type="button" class="btn" onclick="advance('${o.id}')">${label}</button></div></div>`;
}

async function reload(){
  const err=document.getElementById('board-err');
  try{
    const orders=await authed(t=>api.listOrders(t));
    const list=orders||[];
    document.getElementById('board-title').textContent=`طلباتك (${list.length})`;
    document.getElementById('orders').innerHTML=list.length?list.map(orderCard).join(''):'<p class="muted">مفيش طلبات متسلّمة ليك دلوقتي.</p>';
    err.style.display='none';
  }catch(e){err.textContent=errText(e);err.style.display='';}
}
function showBoard(){
  document.getElementById('login-card').style.display='none';
  document.getElementById('board').style.display='';
  reload();if(timer)clearInterval(timer);timer=setInterval(reload,20000);
}
async function advance(id){
  const err=document.getElementById('board-err');
  try{await authed(t=>api.advance(t,id));await reload();}catch(e){err.textContent=errText(e);err.style.display='';}
}
</script>
</body>
</html>
